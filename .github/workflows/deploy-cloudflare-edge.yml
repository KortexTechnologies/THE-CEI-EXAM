name: Verify and deploy Cloudflare edge

on:
  pull_request:
    paths:
      - "cloudflare-edge/**"
      - ".github/workflows/deploy-cloudflare-edge.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare-edge/**"
      - ".github/workflows/deploy-cloudflare-edge.yml"
  workflow_dispatch:
    inputs:
      release_id:
        description: "Approved immutable release-manifest ID"
        required: true
        type: string
      release_manifest_sha256:
        description: "SHA-256 of the approved release manifest"
        required: true
        type: string
      candidate_commit_sha:
        description: "Approved edge commit SHA (must equal the dispatched revision)"
        required: true
        type: string
      production_deployment_approved:
        description: "Action-time approval to deploy production edge routes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: theceiexam-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Cloudflare edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-edge
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Worker from canonical TypeScript source
        run: npx --yes esbuild@0.25.9 worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=dist/worker.mjs

      - name: Attest candidate-bound production build
        run: node write-release-build-metadata.mjs --production

      - name: Verify edge behaviour
        run: |
          node write-release-build-metadata.mjs --verify-production
          node verify.mjs

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'workflow_dispatch' && inputs.production_deployment_approved == true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: cloudflare-edge
    env:
      CLOUDFLARE_ACCOUNT_ID: 1b77e983b9da655eb6ee11e304b9dcaa
    steps:
      - name: Check out verified release source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate action-time release authority
        shell: bash
        env:
          APPROVED_RELEASE_ID: ${{ inputs.release_id }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          APPROVED_CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
        run: |
          if ! printf '%s' "$APPROVED_RELEASE_ID" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._:/#-]{0,199}$'; then
            echo 'Invalid release manifest ID' >&2
            exit 1
          fi
          if ! printf '%s' "$APPROVED_MANIFEST_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo 'Invalid release manifest SHA-256' >&2
            exit 1
          fi
          if ! printf '%s' "$APPROVED_CANDIDATE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
            echo 'Invalid approved edge commit SHA' >&2
            exit 1
          fi
          if [ "$APPROVED_CANDIDATE_SHA" != "$GITHUB_SHA" ]; then
            echo 'Dispatched edge revision does not match the approved candidate' >&2
            exit 1
          fi

      - name: Rebuild and attest approved edge candidate
        run: |
          npx --yes esbuild@0.25.9 worker/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=dist/worker.mjs
          node write-release-build-metadata.mjs --production
          node write-release-build-metadata.mjs --verify-production
          node verify.mjs

      - name: Resolve an existing scoped Cloudflare token
        env:
          TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_CF_ALIAS: ${{ secrets.CF_API_TOKEN }}
          TOKEN_ALT_ALIAS: ${{ secrets.CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          if [ -n "$TOKEN_PRIMARY" ]; then
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN_PRIMARY" >> "$GITHUB_ENV"
            echo 'Using CLOUDFLARE_API_TOKEN secret'
          elif [ -n "$TOKEN_CF_ALIAS" ]; then
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN_CF_ALIAS" >> "$GITHUB_ENV"
            echo 'Using CF_API_TOKEN secret'
          elif [ -n "$TOKEN_ALT_ALIAS" ]; then
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$TOKEN_ALT_ALIAS" >> "$GITHUB_ENV"
            echo 'Using CLOUDFLARE_TOKEN secret'
          else
            echo 'No supported Cloudflare token secret is configured' >&2
            exit 1
          fi

      - name: Deploy production Worker and routes
        run: npx --yes wrangler@4.123.0 deploy --env production
